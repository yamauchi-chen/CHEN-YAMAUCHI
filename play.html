      if(m<=focus){ S.studyMode=m<=itMin?"intern":mode==="intern"&&S.internState!=="open"?"ky":mode; studyMinute(); }
    }
    S.streak=(S.streak||0)+1; S.streakMax=Math.max(S.streakMax||0,S.streak);

/* 双击窗外或人物画面：放大到整个屏幕 */
let FSV=null;
function openFsv(k){ FSV=k; const el=$("#fsv"); el.hidden=false; el.setAttribute("aria-hidden","false"); requestAnimationFrame(()=>el.classList.add("show")); sfx("page"); fsvDraw(); }
function closeFsv(){ FSV=null; const el=$("#fsv"); el.classList.remove("show"); el.setAttribute("aria-hidden","true"); setTimeout(()=>{ if(!FSV) el.hidden=true; },250); }
function fsvDraw(){
  if(!FSV) return;
  const src=document.getElementById(FSV==="win"?"outside":"you"), c=$("#fsvC"), b=$("#fsvBg");
  if(c.width!==src.width||c.height!==src.height){ c.width=b.width=src.width; c.height=b.height=src.height; }
  const G=0.618, W=innerWidth*G, H=innerHeight*G, r=src.width/src.height; let h=H, w=h*r; if(w>W){ w=W; h=w/r; }
  c.style.width=w+"px"; c.style.height=h+"px";
  c.getContext("2d").drawImage(src,0,0); b.getContext("2d").drawImage(src,0,0);
  const cap=document.getElementById(FSV==="win"?"winCap":"youCap").textContent, ce=$("#fsvCap"); if(ce.textContent!==cap) ce.textContent=cap;
  requestAnimationFrame(fsvDraw);
}
document.querySelectorAll(".frame.win,.frame.me").forEach(f=>{ f.title="双击放大"; f.addEventListener("dblclick",()=>openFsv(f.classList.contains("win")?"win":"me")); });
$("#fsv").addEventListener("click",closeFsv);
addEventListener("keydown",e=>{ if(e.key==="Escape"&&FSV) closeFsv(); });
$("#muteBtn").onclick=e=>{ e.stopPropagation(); auInit(); PREF.snd=PREF.snd==="off"?"on":"off"; savePref(); auApply(); muteIcon(); if(!$("#gpanel").hidden) renderGear(); };
muteIcon();
$("#gear").onclick=()=>{ $("#gpanel").classList.remove("center"); const p=$("#gpanel"), open=p.hidden; p.hidden=!open; $("#gear").setAttribute("aria-expanded",String(open)); if(open) renderGear(); };
newGame(); renderIntro();
document.addEventListener("visibilitychange",()=>{ if(document.hidden && S.phase==="market"){ last=0; }});
})();
</script>
<script>
/* 先把图片包下载完（显示进度），再启动游戏。直接双击本地文件打开时，退回普通的 script 加载。 */
(function(){
  "use strict";
  var TOTAL=11377393, bar=document.getElementById("alBar"), pct=document.getElementById("alPct"), sub=document.getElementById("alSub");
  var started=false, got=0, lastGot=0, watch=0;
  function show(f){ var p=Math.max(0,Math.min(99,Math.floor(f*100))); bar.style.width=p+"%"; pct.textContent="正在加载画面 "+p+"%"; }
  function runGame(){
    if(started) return; started=true; clearInterval(watch);
    bar.style.width="100%"; pct.textContent="加载完成";
    var s=document.createElement("script"); s.text=document.getElementById("gameSrc").textContent; document.body.appendChild(s);
    var L=document.getElementById("artLoad"); if(L){ L.classList.add("done"); setTimeout(function(){ L.remove(); },450); }
  }
  function viaTag(){
    var s=document.createElement("script"); s.src="demo_art.js";
    s.onload=runGame;
    s.onerror=function(){ pct.textContent="图片没能加载，先用简笔画面开始"; setTimeout(runGame,1500); };
    document.head.appendChild(s);
  }
  watch=setInterval(function(){
    if(got===lastGot) sub.textContent="网速有点慢，还在下载（已下载 "+(got/1048576).toFixed(1)+" MB / 约 "+(TOTAL/1048576).toFixed(0)+" MB）";
    lastGot=got;
  },8000);
  if(location.protocol==="file:"||!window.fetch||!window.ReadableStream||!window.Blob||!window.URL){ viaTag(); return; }
  fetch("demo_art.js").then(function(r){
    if(!r.ok||!r.body) throw new Error("HTTP "+r.status);
    var rd=r.body.getReader(), parts=[];
    function pump(){ return rd.read().then(function(x){ if(x.done) return parts; parts.push(x.value); got+=x.value.length; show(got/TOTAL); return pump(); }); }
    return pump();
  }).then(function(parts){
    var url=URL.createObjectURL(new Blob(parts,{type:"text/javascript"}));
    var s=document.createElement("script"); s.src=url;
    s.onload=function(){ URL.revokeObjectURL(url); runGame(); };
    s.onerror=function(){ URL.revokeObjectURL(url); viaTag(); };
    document.head.appendChild(s);
  }).catch(function(){ viaTag(); });
})();
</script>
