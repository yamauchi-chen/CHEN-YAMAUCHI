<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大三下的好时候</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%2317151d%27/%3E%3Cpath d=%27M12 44 L24 30 L33 37 L50 18%27 fill=%27none%27 stroke=%27%23f2b544%27 stroke-width=%276%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap"></noscript>
<style>
/* 布局：深夜宿舍里一部发光的手机居中；手机外是一扇窗，窗外的世界随“快乐阈值”褪色。单一夜色主题。 */
:root{
  --room:#17151d; --room-2:#221f2b;
  --ink:#ece8f2; --muted:#9a95ab; --faint:#5d586c;
  --phone:#0d0c12; --surface:#191822; --surface-2:#22202d; --line:#2e2b3a;
  --gold:#f2b544;          /* 涨涨证券的金色，只用于炒股 App */
  --up:#ef4a52; --down:#27b36b;   /* 红涨绿跌 */
  --life:#f3c58c; --life-2:#9cc98a; --sky:#8fc3e8;
  --warn:#f08a4b;
  --lifeSat:1;
  --f-display:"ZCOOL QingKe HuangYou","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--room);color:var(--ink);font-family:var(--f-body);margin:0;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

/* 房间 */
.room{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 110%,#2b2636 0%,var(--room) 60%);filter:saturate(var(--lifeSat));transition:filter 2s}
.window{position:absolute;left:6%;top:9%;width:min(26vw,340px);aspect-ratio:3/4;border:10px solid #2a2633;border-radius:6px;overflow:hidden;
  background:linear-gradient(180deg,var(--sky) 0%,#cfe6f0 55%,var(--life-2) 56%,#6fa864 100%);box-shadow:0 0 120px 30px rgba(243,197,140,.12)}
.window::before{content:"";position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:var(--life);right:16%;top:14%;box-shadow:0 0 40px 10px rgba(243,197,140,.6)}
.window::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#2a2633 48%,#2a2633 52%,transparent 52%),linear-gradient(0deg,transparent 48%,#2a2633 48%,#2a2633 52%,transparent 52%)}
.window{background:#2a2633}
.window::before,.window::after{display:none}
.window canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.window-cap{position:absolute;left:6%;top:calc(9% + min(26vw,340px)*4/3 + 18px);width:min(26vw,340px);color:var(--faint);font-size:12px;line-height:1.6}
.desk{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,#2a2431,#1d1922)}
@media (max-width:860px){.window,.window-cap{display:none}}

/* 右侧：像素画面里的你 */
.you{position:fixed;right:5%;top:50%;transform:translateY(-50%);width:min(27vw,400px);display:grid;gap:10px;z-index:1}
.you canvas{width:100%;aspect-ratio:4/3;image-rendering:pixelated;border:8px solid #2a2633;border-radius:6px;background:#000;display:block;transition:filter 1.5s}
.you-cap{font-size:12px;color:var(--muted);line-height:1.7;min-height:3.4em}
@media (max-width:1080px){.you{display:none}}

/* 手机 */
.stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;gap:28px;padding-inline:16px;padding-block:20px}
:root{--sideW:min(calc((100vw - 400px - 120px)/2), calc((100vh - 130px)*0.75), 560px)}
.side{flex:0 0 var(--sideW);width:var(--sideW);display:flex;flex-direction:column;gap:10px;min-width:0}
.frame{border:8px solid #2a2633;border-radius:8px;background:#000;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.frame.win{border-color:#3a3346}
.frame canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;image-rendering:pixelated;transition:filter 1.5s}
#outside{filter:saturate(var(--lifeSat))}
.side-cap{font-size:12px;color:var(--muted);line-height:1.7;min-height:3.4em}
@media (max-width:1000px){.side{display:none}}
.phone{position:relative;flex:0 0 auto;width:min(400px,100%);height:min(820px,100%);background:var(--phone);border-radius:42px;border:9px solid #050408;
  box-shadow:0 0 0 1px #3a3546,0 40px 120px rgba(0,0,0,.6),0 0 160px rgba(242,181,68,.06);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:520px){.stage{padding:0}.phone{width:100%;height:100%;border-radius:0;border:0}}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 6px;font-size:12px;color:var(--muted);flex:none}
.statusbar b{color:var(--ink);font-weight:500}
.screen{position:relative;flex:1;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.homebar{flex:none;height:22px;display:flex;align-items:center;justify-content:center}
.homebar button{width:120px;height:5px;border-radius:3px;background:#4a4558}
.homebar button:hover{background:#6c6680}

/* 压力视觉 */
.phone.s2 .screen,.laptop.s2 .lap-screen{filter:contrast(1.05) saturate(.85)}
.phone.s3 .screen,.laptop.s3 .lap-screen{filter:contrast(1.12) saturate(.7) blur(.3px)}
.phone.s3 .jitter{animation:jit .18s steps(2) infinite}
@keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(.6px,-.5px)}}
.noise{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.phone.s3 .noise,.laptop.s3 .noise{opacity:1}
@media (prefers-reduced-motion:reduce){.phone.s3 .jitter{animation:none}}

/* 通用 */
.pad{padding:16px 18px}
.h-app{display:flex;align-items:center;gap:10px;padding:10px 18px;position:sticky;top:0;z-index:2;background:inherit;border-bottom:1px solid var(--line)}
.h-app .back{font-size:20px;color:var(--muted);padding:2px 6px}
.h-app h2{margin:0;font-size:16px;font-weight:700;flex:1}
.btn{padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;text-align:center}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);color:var(--phone);border-color:var(--ink);font-weight:700}
.btn.gold{background:var(--gold);color:#1a1205;border-color:var(--gold);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
.small{font-size:12px;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted)}

/* 开场 */
.intro{background:linear-gradient(180deg,#14121a,#0d0c12);display:flex;flex-direction:column;gap:18px;padding:40px 26px}
.intro h1{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1.05;margin:24px 0 0;letter-spacing:.02em;text-wrap:balance}
.intro h1 small{display:block;font-size:20px;color:var(--muted);margin-bottom:8px}
.intro p{margin:0;line-height:1.85;color:#cfcadb;font-size:15px}
.intro .paths{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.intro .paths div{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:13px;line-height:1.5}
.intro .paths div:last-child{border-color:var(--gold);color:var(--gold)}
.intro .paths.two{grid-template-columns:1fr 1fr}
.intro .paths.two div:last-child{border-color:var(--line);color:inherit}
.q{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;line-height:1.5;font-size:14px}
.opt input{margin-top:3px;accent-color:var(--gold)}
.opt:has(input:checked){border-color:var(--gold)}

/* 锁屏 */
.lock{background:linear-gradient(180deg,#2c3a4d 0%,#3d4a3a 100%);filter:saturate(var(--lifeSat));display:flex;flex-direction:column;align-items:stretch;padding:28px 16px 18px;gap:10px}
.lock .clock{font-family:var(--f-mono);font-size:64px;font-weight:500;text-align:center;letter-spacing:-.02em;line-height:1;margin-top:10px}
.lock .date{text-align:center;color:#d9e1ea;font-size:14px;margin-bottom:14px}
.notif{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(20,20,28,.62);backdrop-filter:blur(12px);border-radius:16px;padding:11px 13px;font-size:13px;line-height:1.5;width:100%}
.notif .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700}
.notif .src{font-size:11px;color:#b8b3c8}
.notif.dca{opacity:.82}
.unlock{margin-top:auto;align-self:center;color:#e6e9ef;font-size:13px;padding:10px 26px;border-radius:20px;background:rgba(0,0,0,.25)}

/* 主屏 */
.home{background:linear-gradient(165deg,#3a4f63 0%,#4f5c45 55%,#6b5a44 100%);filter:saturate(var(--lifeSat));padding:22px 18px;display:flex;flex-direction:column;gap:22px}
.home .widget{background:rgba(15,15,22,.45);backdrop-filter:blur(10px);border-radius:20px;padding:14px 16px;display:grid;gap:8px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--life);border-radius:3px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px}
.appic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#eef;position:relative}
.appic .ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:22px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.appic .badge{position:absolute;top:-4px;right:10px;min-width:18px;height:18px;border-radius:9px;background:var(--up);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-family:var(--f-mono)}
.i-stock{background:linear-gradient(140deg,#ffd36b,#e09a1b);color:#3a2300;font-family:var(--f-display);font-weight:400!important;font-size:30px!important}
.i-chat{background:#2b9a52;color:#fff}
.i-study{background:#f1ede4;color:#3c4a5a}
.i-social{background:#5b6cf0;color:#fff}
.i-news{background:#e9ecf1;color:#2c3a4f}
.i-comm{background:#e0524a;color:#fff}
.hpush{display:grid;gap:4px;text-align:left;width:100%;border-radius:16px;padding:12px 14px;color:#fff}
.hpush .hp-tag{font-size:11px;opacity:.85}
.hpush.lv2{background:rgba(30,32,44,.78);backdrop-filter:blur(12px);border:1px solid rgba(242,181,68,.6)}
.hpush.lv2 b{font-size:16px;color:#ffd36b}
.hpush.lv3{background:linear-gradient(135deg,#e0524a,#b8232c);box-shadow:0 0 0 0 rgba(224,82,74,.7);animation:pulse 1.6s infinite;padding:16px}
.hpush.lv3 b{font-size:22px;line-height:1.25}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,82,74,.6)}70%{box-shadow:0 0 0 14px rgba(224,82,74,0)}100%{box-shadow:0 0 0 0 rgba(224,82,74,0)}}
@media (prefers-reduced-motion:reduce){.hpush.lv3{animation:none}}
.newsapp{background:#f6f7f9;color:#1d1c22}
/* 浅色页面上的涨跌色要更深一点，否则看不清 */
.newsapp .down,.commapp .down,.chat .down,.social .down,.study .down,.album .down,.view.shop .down,.view.loan .down,.view.pz .down,.store .down{color:#17834a}
.newsapp .up,.commapp .up,.chat .up,.social .up,.study .up,.album .up,.view.shop .up,.view.loan .up,.view.pz .up,.store .up{color:#c62f38}
.newsapp .h-app{background:#f6f7f9;border-color:#e3e6ec}
.commapp{background:#fbf3f1;color:#1d1c22}
.commapp .h-app{background:#fbf3f1;border-color:#efdcd8}
.newsapp .back,.commapp .back{color:#8a8592}
.nitem{padding:12px 18px;border-bottom:1px solid #e3e6ec;display:grid;gap:4px}
.nitem p,.citem p{margin:0;font-size:14px;line-height:1.6}
.nsrc{display:flex;gap:8px;align-items:center;font-size:11px;color:#8a8592}
.tag2{border:1px solid;border-radius:4px;padding:0 5px;font-size:11px}
.citem{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 18px;border-bottom:1px solid #efdcd8}
.tap{cursor:pointer;transition:background .15s}.tap:hover{background:rgba(0,0,0,.035)}
.cmore{font-size:11px;color:#7f7572;margin-top:4px}
.cdetail{padding:16px 20px 24px;display:grid;gap:10px}
.cdetail .ct{margin:0;font-size:16px;line-height:1.75;color:#2a2630}
.cdetail .nsrc{display:flex;gap:10px;align-items:center;font-size:12px;color:#8a8592}
.cdetail .nsrc b{color:#2a2630;font-size:14px}
.cstock{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#f3efe9;font-size:13px}
.cstock .up{color:#c62f38}.cstock .down{color:#17834a}
.cstock .btn{padding:6px 12px;font-size:12px}
.cbtns{display:flex;gap:6px;flex:none}
.cb-buy{padding:7px 14px;border-radius:10px;background:linear-gradient(180deg,#ff5d63,#e0373f);color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(224,55,63,.35)}
.cb-buy:hover{filter:brightness(1.08)}
.cb-look{padding:7px 12px;border-radius:10px;background:#fff;color:#5d5866;border:1px solid #ddd5d0;font-size:12px}
.trade [data-k="buy"].pulse{animation:bpulse .6s ease 4}
@keyframes bpulse{50%{box-shadow:0 0 0 4px rgba(255,93,99,.45)}}
.cact{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee6e2;padding-bottom:10px}
.cact .chip{color:#5d5866;border-color:#ddd5d0}.cact .chip.on{background:#ffe9e6;color:#c4473f;border-color:#f3c2bc}
.ccm{display:grid;gap:2px}
.ccm .cc{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px dashed #eee6e2;font-size:13.5px;line-height:1.55}
.ccm .cc b{font-size:12px;color:#7a6f6b;white-space:nowrap}
.ccm .cc em{font-style:normal;font-size:11px;color:#857b78}
.cav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.acc2{margin-top:6px;color:#6d6878;font-size:11px}

/* 炒股 App（始终鲜艳，不受褪色影响） */
.stock{background:#121118}
.stock .h-app{background:#121118}
.stock .h-app h2{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--gold)}
.acct{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.acct .lbl{font-size:11px;color:var(--muted)}
.acct .val{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.acct .val.big{font-size:24px}
.acct .wage{grid-column:1/-1;font-size:12px;color:var(--muted)}
.news{padding:10px 18px;border-bottom:1px solid var(--line)}
.news summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
.news summary::-webkit-details-marker{display:none}
.news ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.news li{font-size:13px;line-height:1.5}
.news .tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px;color:var(--muted)}
.acc{font-size:11px;color:var(--faint);margin-top:6px}
.slist{list-style:none;margin:0;padding:0}
.slist li button{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid #1f1d29;text-align:left}
.slist li button.on{background:#1b1a24}
.slist .nm{font-size:15px}
.slist .cd{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.slist .px{font-family:var(--f-mono);font-size:15px;text-align:right}
.slist .pc{font-family:var(--f-mono);font-size:13px;min-width:68px;text-align:center;padding:4px 6px;border-radius:6px;color:#fff}
.idx{display:flex;justify-content:space-between;padding:8px 18px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.slist li.th button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 18px;font-size:14px;color:var(--ink);background:#17161f;border-bottom:1px solid #1f1d29;text-align:left}
.slist li.th button:hover{background:#1c1b25}
.slist .chev{font-style:normal;display:inline-block;width:16px;color:var(--muted)}
.slist .cnt{font-size:11px;color:var(--faint);margin-left:8px}
.slist em.new{font-style:normal;font-size:10px;color:#1a1205;background:var(--gold);border-radius:4px;padding:0 4px;margin-left:6px}
.slist button.addth{display:block;width:100%;padding:13px 18px;text-align:center;color:var(--gold);font-size:13px;border-bottom:1px solid #1f1d29}
.thlist{display:grid;gap:6px;max-height:52vh;overflow-y:auto}
.thlist .btn{display:flex;justify-content:space-between;align-items:center;text-align:left}
.aucbox{padding:12px 18px 6px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.auctit{font-size:14px;color:var(--gold);font-family:var(--f-mono)}
.orders{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.orders li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.orders .btn{padding:4px 10px;font-size:12px}
.stabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stabs button{padding:9px 4px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.stabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.sec{padding:10px 18px 6px;font-size:11px;letter-spacing:.12em;color:var(--muted);background:#17161f;border-bottom:1px solid #1f1d29}
.plist{list-style:none;margin:0;padding:0}
.plist li{border-bottom:1px solid #1f1d29}
.plist li>button,.plist li>div:first-child{width:100%;text-align:left}
.plist li>button{display:block;padding:11px 18px}
.plist li:not(:has(button)){padding:11px 18px}
.plist .pl1{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.plist .pl2,.plist .pl3{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.plist .pl3{color:#cfcadb}
.plist .empty{padding:14px 18px;color:var(--muted);font-size:13px}
.chartbox{padding:12px 18px 4px}
.ctabs{display:flex;gap:6px;margin-bottom:8px}
.ctabs button{font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.ctabs button.on{color:var(--gold);border-color:var(--gold)}
.chartbox canvas{width:100%;height:150px;display:block}
.pos{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 18px 8px;gap:8px;flex-wrap:wrap}
.trade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 18px}
.trade .b{background:rgba(239,74,82,.14);border:1px solid rgba(239,74,82,.5);color:#ff9aa0;border-radius:10px;padding:10px 4px;font-size:13px}
.trade .s{background:rgba(39,179,107,.12);border:1px solid rgba(39,179,107,.5);color:#7fe0aa;border-radius:10px;padding:10px 4px;font-size:13px}
.ff{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px 18px}
.ff .btn{flex:1}
.ff .btn.on{background:var(--gold);color:#1a1205;border-color:var(--gold)}
.marginbadge{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:1px 6px}

/* 消息 */
.chat,.study,.social{background:#f4f2ee;color:#1d1c22;filter:saturate(var(--lifeSat))}
.social .btn{background:#fff;border:1px solid #ddd7ce;color:#2a2630;font-weight:600}   /* 浅色页面上的按钮：白底深字，别和深色主题的按钮混用 */
.social .btn.liked{color:#d23a43;border-color:#efc4c6;background:#fff6f6}
.chat .h-app,.study .h-app,.social .h-app{border-color:#e2ded6}
.chat .back,.study .back,.social .back{color:#8a8592}
.thread{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid #e7e3dc;width:100%;text-align:left}
.avatar{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.thread .t{flex:1;min-width:0}
.thread .t b{font-size:15px}
.thread .t div{font-size:13px;color:#77727f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .ub{background:var(--up);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.msgs{display:flex;flex-direction:column;gap:10px;padding:16px 14px}
.msg{max-width:78%;background:#fff;border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.55;box-shadow:0 1px 0 #e5e1da}
.msg.me{align-self:flex-end;background:#a6e488}
.msg .d{font-size:10px;color:#9a95a3;margin-bottom:2px}
.msep{align-self:center;font-size:11px;color:#9a95a3;background:rgba(0,0,0,.05);border-radius:8px;padding:2px 9px;margin:4px 0}
.msg.typing{display:flex;gap:4px;align-items:center;padding:12px 14px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:#b9b3c2;animation:tdot 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{30%{transform:translateY(-4px);background:#8a8592}}
.typing-h{color:#5aa96e!important;margin-left:auto}
.reply.topics .rp-h{font-weight:700;color:#5b6cf0}
.reply.topics.bad .rp-h{color:#9a8f8c;font-weight:400}

/* 自习 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 18px 0;background:#e9e5dc;border-radius:12px;padding:4px}
.seg button{padding:8px;border-radius:9px;font-size:13px;color:#5d5866}
.seg button.on{background:#fff;color:#1d1c22;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.study .goal.cur{outline:2px solid #4f7fae}
.rl{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#4a4652}
.rl span:last-child{text-align:right}
.create{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
#pv{width:120px;height:160px;image-rendering:pixelated;border-radius:10px;border:2px solid var(--line);background:#000}
.cfields{display:grid;gap:6px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--gold)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.tin{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.fb{margin:0;font-size:12px;line-height:1.6;padding:8px 10px;border-radius:10px}
.fb.ok{background:rgba(39,179,107,.14);color:#9fe3bd}
.fb.no{background:rgba(239,74,82,.14);color:#ffb3b7}
.study .goal{margin:14px 18px;padding:16px;border-radius:16px;background:#fff;display:grid;gap:10px;box-shadow:0 1px 0 #e5e1da}
.study .goal h3{margin:0;font-size:15px}
.study .bar{background:#ebe7df}
.study .bar i{background:#4f7fae}
.study .bar.intern i{background:#c47b3d}
.studying{margin:14px 18px;padding:18px;border-radius:16px;background:#2f3e4f;color:#e8eef5;display:grid;gap:6px;text-align:center}
.studying .num{font-size:30px}

/* 圈子 */
.post{padding:14px 18px;border-bottom:1px solid #e7e3dc;display:grid;gap:6px}
.social .h-app{background:#f4f2ee}
.post .u{font-size:13px;color:#5b6cf0;font-weight:700}
.post .c{font-size:14px;line-height:1.6}
.post .m{font-size:11px;color:#9a95a3}

/* 横幅 / toast */
.banner{position:absolute;left:10px;right:10px;top:8px;z-index:30;transform:translateY(-130%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.banner.show{transform:none}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:31;background:rgba(30,28,40,.95);border:1px solid var(--line);color:var(--ink);font-size:12px;padding:8px 14px;border-radius:20px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* 底部弹层（收盘、事件、晚间） */
.sheet{position:absolute;inset:0;z-index:20;background:rgba(5,4,8,.72);display:flex;align-items:flex-end}
.sheet .card{width:100%;max-height:92%;overflow-y:auto;background:#16151d;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 20px 24px;display:grid;gap:14px}
.sheet h3{margin:0;font-size:18px}
.sheet p{margin:0;line-height:1.75;font-size:14px;color:#d7d2e2;white-space:pre-line}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono)}
.choices{display:grid;gap:8px}
.choices .btn{text-align:left;line-height:1.5}
.choices .btn small{display:block;color:var(--muted);font-size:12px}
.dim{color:var(--muted);font-size:12px}

/* 复盘报告 */
.report{background:#f3f1ec;color:#1d1c22;padding:0 0 30px}
.report .hd{background:#1d1c22;color:#f3f1ec;padding:26px 20px 22px}
.report .hd h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:4px 0 0}
.report section{padding:18px 20px;border-bottom:1px solid #e2ded6;display:grid;gap:10px}
.report h4{margin:0;font-size:12px;letter-spacing:.12em;color:#7d7887;font-weight:500}
.report .row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;font-size:13px}
.report .row .bar{background:#e4e0d8;height:10px;border-radius:5px}
.report .row .bar i{border-radius:5px}
.report .big{font-family:var(--f-mono);font-size:28px;font-variant-numeric:tabular-nums}
.report p{margin:0;font-size:14px;line-height:1.75}
.report ul{margin:0;padding-left:18px;font-size:13px;line-height:1.75}
.report svg{width:100%;height:auto;display:block}
.report .ending{background:#1d1c22;color:#ece8f2;margin:18px 16px 0;border-radius:18px;padding:22px 20px;display:grid;gap:12px}
.report .ending p{white-space:pre-line;color:#ece8f2}
.report .final{font-family:var(--f-display);font-size:22px;line-height:1.4;text-align:center;padding:26px 20px 6px;color:#1d1c22}

/* ===== 第 15 版：背景、全屏总结、相册、动效 ===== */
.stage{z-index:1}
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.backdrop .bd{position:absolute;inset:-8%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;transform:scale(1.06)}
.backdrop .bd.on{opacity:1}
.backdrop .bd.blur{filter:blur(26px) brightness(.42) saturate(var(--lifeSat))}
.backdrop .bd.soft{filter:blur(1.5px) brightness(.5) saturate(var(--lifeSat))}
.backdrop .bd.plain{filter:saturate(var(--lifeSat))}
.backdrop .bd.wide{filter:blur(2px) brightness(.56) saturate(var(--lifeSat));transform:scale(1.03)}
.backdrop .vig{position:absolute;inset:0;background:radial-gradient(120% 95% at 50% 45%,rgba(8,6,12,0) 45%,rgba(8,6,12,.6) 100%)}
.frame{position:relative;border-color:#2f2a3a;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.05)}
.ftag{position:absolute;z-index:2;top:10px;left:10px;font-size:11px;letter-spacing:.16em;color:#efeaf7;background:rgba(14,12,20,.5);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:3px 8px;backdrop-filter:blur(6px);pointer-events:none}
.side-cap{color:#cbc5d8;border-left:2px solid rgba(242,181,68,.45);padding-left:10px}
.side-cap.fresh{animation:capin .6s ease}
@keyframes capin{from{opacity:0;transform:translateY(4px)}}
.phone::after{content:"";position:absolute;inset:0;border-radius:33px;pointer-events:none;z-index:40;background:linear-gradient(115deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 26%)}
.view.enter{animation:vin .24s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(6px) scale(.99)}}
.sheet{animation:sfade .25s ease}
.sheet .card{animation:sup .34s cubic-bezier(.2,.8,.2,1)}
@keyframes sfade{from{opacity:0}}
@keyframes sup{from{transform:translateY(40px)}}
#sb-time.slow{opacity:.55}
/* 全屏弹层：收盘总结、复盘报告 */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:28px;background:rgba(8,6,12,.55);backdrop-filter:blur(10px) saturate(.8);opacity:0;transition:opacity .45s ease;pointer-events:none}
.ov.show{opacity:1;pointer-events:auto}
.ov .ovc{width:min(1000px,100%);max-height:100%;overflow:auto;border-radius:24px;background:#16151d;border:1px solid #2e2b3a;box-shadow:0 40px 120px rgba(0,0,0,.6);transform:translateY(18px) scale(.985);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.ov.show .ovc{transform:none}
.daysum{display:grid;grid-template-columns:minmax(240px,360px) 1fr}
.daysum .shot{margin:0;position:relative;background:#000;min-height:100%}
.daysum .shot img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.snapbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.snapbar em{font-style:normal;color:#f2d38a}
.snapb{padding:6px 12px;border-radius:10px;background:#f2b544;color:#1b1820;font-size:12px;font-weight:700}
.snapb.ghost{background:rgba(255,255,255,.12);color:#e8e3f0;font-weight:400}
.snapprev{width:auto;max-width:min(200px,60%);max-height:min(280px,36vh);display:block;margin:6px auto 0;border:8px solid #fbf8f2;border-bottom-width:24px;box-shadow:0 10px 30px rgba(0,0,0,.35);image-rendering:pixelated;transform:rotate(-2deg)}
.daysum .sub b.up{color:var(--up)}.daysum .sub b.down{color:var(--down)}
.daysum .shot figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;font-size:12px;line-height:1.6;color:#e8e3f0;background:linear-gradient(180deg,rgba(8,6,12,0),rgba(8,6,12,.85))}
.daysum .info{padding:30px 32px;display:grid;gap:16px;align-content:start}
.daysum .pl{font-family:var(--f-mono);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.daysum .sub{color:var(--muted);font-size:13px}
.daysum .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#1d1b26;border:1px solid #2a2735;border-radius:14px;padding:12px 14px}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.stat .v{font-family:var(--f-mono);font-size:20px;margin-top:4px}
.stat .n{font-size:11px;color:var(--muted);margin-top:2px}
.sbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,#9cc98a,#f2b544 55%,#ef4a52)}
.daysum .lines p{margin:0;font-size:14px;line-height:1.75;color:#d7d2e2}
.daysum .btn{justify-self:start;min-width:180px}
@media (max-width:720px){.daysum{grid-template-columns:1fr}.daysum .shot{max-height:42vh}.daysum .pl{font-size:40px}}
.ov.rep .ovc{width:min(1200px,100%);background:#f3f1ec;color:#1d1c22}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.rgrid section{border-right:1px solid #e2ded6}
.report section.wide{grid-column:1/-1}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cmp figure{margin:0;display:grid;gap:6px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;image-rendering:pixelated;border-radius:10px;display:block;background:#222}
.cmp figcaption{font-size:12px;color:#6d6878;line-height:1.5}
/* 相册 */
.i-album{background:linear-gradient(140deg,#fff3dd,#f1c48c);color:#6a4320}
.album{background:#ece6dc;color:#29242f}
.album .h-app{background:#ece6dc;border-color:#ddd5c8}
.album .back{color:#5f5869}
.album .small{color:#6c6676}
.alb{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding:16px 16px 24px}
.pol{background:#fff;padding:8px 8px 10px;box-shadow:0 6px 16px rgba(0,0,0,.16);transform:rotate(var(--r));display:grid;gap:6px;text-align:left;transition:transform .2s}
.pol:hover{transform:rotate(0) scale(1.02)}
.pol img{width:100%;aspect-ratio:3/4;object-fit:cover;image-rendering:pixelated;display:block;background:#222}
.pol span{font-size:11px;line-height:1.45;color:#4a4552}
.alv{padding:14px 16px 24px;display:grid;gap:12px}
.alv>img{width:100%;image-rendering:pixelated;border:8px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.18);display:block}
.alv p{margin:0;font-size:14px;line-height:1.7}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs figure{margin:0;display:grid;gap:4px}
.vs img{width:100%;image-rendering:pixelated;display:block}
.vs figcaption{font-size:11px;color:#6d6878;line-height:1.4}
.alnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.album .btn{background:#fff;border-color:#ddd5c8;color:#29242f}
/* 涨跌停与排队 */
.limtag{font-size:11px;border-radius:5px;padding:1px 6px;margin-left:6px}
.limtag.up{background:rgba(239,74,82,.18);color:#ff9aa0}
.limtag.down{background:rgba(39,179,107,.18);color:#7fe0aa}
.queue{display:grid;gap:6px;padding:0 18px 8px}
.queue .qi{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;line-height:1.5;padding:8px 10px;border-radius:10px;background:#1b1a24;border:1px dashed #3a3646}
.queue .qi.sell{border-color:rgba(39,179,107,.5)}
.queue .qi.buy{border-color:rgba(239,74,82,.5)}
.queue .btn{padding:4px 10px;font-size:12px;flex:none}
.chartbox canvas{cursor:crosshair}
/* 画面设置 */
.gear{position:fixed;top:14px;right:16px;z-index:45;font-size:12px;color:#d9d4e6;background:rgba(20,18,28,.55);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 12px;backdrop-filter:blur(8px)}
.gpanel{position:fixed;top:50px;right:16px;z-index:46;width:252px;background:rgba(22,21,29,.94);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.gpanel[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.view.enter,.sheet,.sheet .card,.side-cap.fresh{animation:none}.ov,.ov .ovc,.backdrop .bd{transition:none}}
/* ===== 第 16 版：宿舍开场、应用商店、专注 App ===== */
/* 专注（番茄钟） */
.i-study{background:linear-gradient(140deg,#ff8a6b,#e5483d);color:#fff}
.tmr{width:28px;height:28px;border:3px solid currentColor;border-radius:50%;position:relative;display:block}
.tmr::before{content:"";position:absolute;left:50%;top:-8px;width:9px;height:4px;background:currentColor;border-radius:2px;transform:translateX(-50%)}
.tmr::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:10px;background:currentColor;border-radius:2px;transform:translateX(-50%)}
.tomato{position:relative;width:196px;height:196px;margin:16px auto 4px}
.tomato .ring{width:100%;height:100%;transform:rotate(-90deg);display:block}
.tomato .trk{fill:none;stroke:#ebe5dc;stroke-width:9}
.tomato .prg{fill:none;stroke:#e5483d;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.tm-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.tm-in .num{font-size:52px;line-height:1;color:#1d1c22;font-weight:500}
.tm-in .small{color:#8a8592}
.tm-where{text-align:center;font-size:12px;color:#77727f;padding:0 18px}
.tm-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 18px 0;background:#fff;border-radius:14px;box-shadow:0 1px 0 #e5e1da}
.tm-stats div{display:grid;gap:2px;text-align:center;padding:10px 4px}
.tm-stats b{font-size:19px;font-weight:500}
.tm-stats span{font-size:11px;color:#8a8592}
.tm-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 18px 0;min-height:12px}
.tm-dots i{width:12px;height:12px;border-radius:50%;background:#e5483d;display:block}
.tm-dots i.f{background:none;border:2px solid #c9c3ba}
.tm-dots i.c{background:#f6b5aa;animation:tpulse 1.6s ease-in-out infinite}
@keyframes tpulse{50%{opacity:.35}}
.tm-note{margin:12px 18px 0;padding:12px 14px;border-radius:14px;background:#2f3e4f;color:#e8eef5;display:grid;gap:4px;font-size:12px;line-height:1.6}
.study .seg button small{font-size:11px;color:#8a8592;font-weight:400}
/* 应用商店 */
.i-store{background:linear-gradient(140deg,#62b4ff,#2f6bf2);color:#fff}
.store{background:#f5f5f7;color:#1d1c22}
.store .h-app{background:#f5f5f7;border-color:#e3e3e8}
.store .back{color:#8a8592}
.st-search{margin:10px 18px 0;padding:9px 12px;border-radius:10px;background:#e7e7ec;color:#8e8e96;font-size:13px}
.st-feat{margin:14px 18px 0;border-radius:18px;padding:18px;color:#fff;background:linear-gradient(150deg,#ff6a4d,#e0233b 55%,#7a1430);box-shadow:0 10px 26px rgba(224,35,59,.25);display:grid;gap:6px;text-align:left;width:calc(100% - 36px)}
.st-feat .ey{font-size:11px;letter-spacing:.12em;opacity:.85}
.st-feat h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15}
.st-feat p{margin:0;font-size:13px;line-height:1.6;opacity:.94}
.st-feat .fine{font-size:10px;opacity:.6}
.st-sec{margin:18px 18px 4px;font-size:15px;font-weight:700}
.st-row{display:grid;grid-template-columns:14px 50px 1fr auto;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #e9e9ee}
.st-row .rk{font-family:var(--f-mono);color:#8e8e96;font-size:13px}
.st-row .ico{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;font-size:20px;font-weight:700}
.st-row .ico.i-stock{font-size:24px!important}
.st-row .nm{font-size:14px;font-weight:700}
.st-row .sb{font-size:12px;color:#6e6e76;line-height:1.4}
.st-row .mt{font-size:11px;color:#74747d}
.st-get{min-width:66px;padding:6px 0;border-radius:14px;background:#e8eefc;color:#2f6bf2;font-weight:700;font-size:13px;text-align:center;position:relative;overflow:hidden}
.st-get.ing{color:transparent;cursor:default}
.st-get.ing::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:#2f6bf2;opacity:.28;transition:width .15s linear}
.st-get.ing::after{content:attr(data-p);position:absolute;inset:0;display:grid;place-items:center;color:#2f6bf2;font-size:12px}
.st-get.open{background:#2f6bf2;color:#fff}
/* 收盘总结：还没下载炒股软件的日子 */
.daysum .pl.focus{color:#ffb3a8}
.daysum .pl small{font-size:18px;color:var(--muted);font-family:var(--f-body)}
/* 回复消息 */
.reply{position:sticky;bottom:0;margin-top:8px;padding:12px 14px 16px;background:#ebe7df;border-top:1px solid #ddd8ce;display:grid;gap:8px}
.reply .rp-h{font-size:12px;color:#6d6878}
.reply.bad .rp-h{color:#b4453c;font-weight:700}
.reply.meh .rp-h{color:#9a6a2e}

/* ===== 第 17 版：桌面布局 ===== */
:root{--lw:clamp(220px,19vw,360px);--pw:clamp(240px,18vw,320px)}
.stage{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--pw);align-items:center;gap:clamp(14px,1.8vw,30px);padding:clamp(10px,2.2vh,28px) clamp(14px,2.2vw,40px);height:100%;justify-content:stretch}
.side{display:flex;flex-direction:column;gap:8px;min-width:0;width:auto;flex:none}
.side.left{align-self:center}
.side.left .frame.win{width:62%}
.side.left .frame.me{width:100%;margin-top:6px}
.side.left .side-cap{min-height:2.6em;font-size:12px}
.side.right{align-self:center;align-items:center}
.deskarea{display:grid;place-items:center;min-width:0;height:100%}
.laptop{width:min(100%,calc((100vh - 110px) * 1.52));filter:drop-shadow(0 40px 60px rgba(0,0,0,.45))}
.lap-lid{position:relative;padding:14px 14px 16px;border-radius:20px 20px 8px 8px;background:linear-gradient(180deg,#2c2936,#17151d);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 2px 0 rgba(255,255,255,.06)}
.lap-cam{position:absolute;top:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#0b0a10;box-shadow:0 0 0 1px #34303f}
.lap-screen{position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:radial-gradient(120% 90% at 20% 0%,#5b4f7a 0%,rgba(91,79,122,0) 55%),radial-gradient(90% 80% at 100% 100%,#a77d86 0%,rgba(167,125,134,0) 60%),linear-gradient(160deg,#2e2b47,#3f3554 55%,#2a2335);filter:saturate(var(--lifeSat))}
.lap-screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:40;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 32%)}
.lap-base{position:relative;height:16px;margin:0 -6%;border-radius:2px 2px 16px 16px/2px 2px 12px 12px;background:linear-gradient(180deg,#d9d5e2 0%,#a9a4b6 55%,#6e6a7b 100%);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.lap-base i{position:absolute;left:50%;top:0;width:15%;height:5px;transform:translateX(-50%);border-radius:0 0 8px 8px;background:#8d889b}
.menubar{position:absolute;top:0;left:0;right:0;height:26px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 12px;font-size:11.5px;color:#ece8f4;background:rgba(16,14,24,.48);backdrop-filter:blur(12px);z-index:30}
.menubar .mb-l,.menubar .mb-r{display:flex;align-items:center;gap:10px;white-space:nowrap}
.menubar .mb-l b,.menubar #mb-app{font-weight:700}
.mb-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block}
.menubar .mb-c{font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.mb-c.up{color:#ff8a90}.mb-c.down{color:#6fe0a4}
#sb-time{font-weight:600}
/* 电脑里的窗口 */
#view{position:absolute;top:36px;bottom:72px;left:0;right:0;margin:0 auto;width:min(560px,94%);border-radius:12px;box-shadow:0 22px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);overflow-y:auto;z-index:5}
#view.enter{animation:winin .26s cubic-bezier(.2,.8,.2,1)}
@keyframes winin{from{opacity:0;transform:scale(.985)}}
#view.stock{width:min(940px,97%)}
#view.intro{width:min(640px,94%)}
#view.home{top:26px;bottom:0;width:100%;border-radius:0;box-shadow:none;background:transparent;overflow:hidden}
#view.lapsleep{top:0;bottom:0;width:100%;border-radius:0;box-shadow:none}
#view .h-app{border-radius:12px 12px 0 0}
/* 炒股软件：左边自选，右边行情和下单 */
#view.stock:has(> #slist){display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);align-content:start;column-gap:0}
#view.stock:has(> #slist) > *{grid-column:2;min-width:0}
#view.stock:has(> #slist) > .h-app,#view.stock:has(> #slist) > .stabs{grid-column:1/-1}
#view.stock:has(> #slist) > #slist{grid-column:1;grid-row:3/span 40;align-self:stretch;border-right:1px solid #24222e}
#view.home{background:transparent;padding:0;display:block;filter:none}
#toast{top:34px}
#screen > .sheet{align-items:center;justify-content:center;background:rgba(5,4,8,.55)}
#screen > .sheet .card{width:min(520px,92%);border-radius:18px;border:1px solid var(--line);max-height:86%}
/* 程序坞 */
.dock{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);display:flex;gap:9px;padding:7px 9px;border-radius:17px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px) saturate(1.2);z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dock[hidden]{display:none}

.dock button:hover{transform:translateY(-3px)}
.dock button.on::after{content:"";position:absolute;bottom:-6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff}
.dock .badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--up);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-family:var(--f-mono)}
.dock .i-stock{font-size:22px!important}
.dock .tmr{width:22px;height:22px;border-width:2.5px}
.dock .tmr::before{top:-6px;width:7px;height:3px}.dock .tmr::after{top:2px;height:8px}
.i-home{background:linear-gradient(140deg,#9a95b4,#5d5878);color:#fff}
/* 桌面 */
.desk-wid{position:absolute;inset:0 0 70px 0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;padding:18px 22px;align-content:start}
.desk-wid .dw-clock{grid-column:1/-1;color:#f3effa;text-shadow:0 2px 16px rgba(0,0,0,.35)}

.dw-card{background:rgba(18,16,28,.42);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;display:grid;gap:7px;color:#ece8f4;font-size:12.5px;align-content:start}

.dw-card .bar{background:rgba(255,255,255,.14)}

.dw-card .btn{padding:5px 10px;font-size:12px}

.idxw .iv{font-family:var(--f-mono);font-size:22px}
.idxw svg{width:100%;height:56px;display:block}
.lapsleep{background:#08070c;display:grid;place-content:center;text-align:center;gap:8px;color:#8a8598}
.lapsleep .num{font-size:44px;color:#6a6578}
/* 手机 */
.phone{width:100%;height:auto;aspect-ratio:9/18.6;max-height:calc(100vh - 60px);border-radius:36px;border-width:7px}
.phone .statusbar{padding:10px 20px 4px;font-size:11px}
.phone .view{position:absolute;inset:0;overflow-y:auto}
.phome{background:linear-gradient(170deg,#3d4b63 0%,#544a63 55%,#6b5248 100%);filter:saturate(var(--lifeSat));padding:24px 14px 16px;display:flex;flex-direction:column;gap:10px}
.phome .ph-clock{font-family:var(--f-mono);font-size:48px;text-align:center;color:#f2eef8;line-height:1;margin-top:8px}
.phome .ph-date{text-align:center;color:#d9d3e6;font-size:12px;margin-bottom:6px}
.phome .ph-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px;margin-top:auto}
.phome .ph-apps .ico{width:52px;height:52px}
.phome .ph-empty{color:#cfc8dc;font-size:12px;text-align:center;padding:10px}
.pfocus{background:#f4f2ee;color:#1d1c22;padding:18px 12px;display:flex;flex-direction:column;gap:4px}

.pfocus .tm-in .num{font-size:44px}
.pfocus .tm-stats{margin:10px 4px 0}
.pfocus .tm-flow{margin:6px 4px 0}
.pfocus p.small{text-align:center;color:#8a8592;margin:10px 0 0}
.pintro{background:#0b0a10;display:grid;place-content:center;text-align:center;gap:6px;color:#6d6878}
.pintro .num{font-size:40px;color:#bdb6cc}
.phone .lock .clock{font-size:52px}
.phone .chat .msgs{padding:12px 10px}
/* 学习资料（电脑） */
.mat{margin:12px 18px 0;border-radius:14px;background:#fff;box-shadow:0 1px 0 #e5e1da;overflow:hidden}
.mat .mt{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#efebe4;font-size:12px;color:#5d5866}

.mat.code .mb{background:#1f1d29;color:#cfc9e0;font-family:var(--f-mono);font-size:12px}
.mat.code .ln{background:#38344a}.mat.code .ln.hl{background:linear-gradient(90deg,#5b6cf0,#38344a)}
.study .tm-where{margin-top:10px}
/* 散户故事 */
.story{padding:14px 18px;border-bottom:1px solid #efdcd8;display:grid;gap:6px;background:#fff8f6}
.newsapp .story{background:#fafbfd;border-color:#e3e6ec}
.story.pin{background:linear-gradient(180deg,#fff3d6,#fff8f0);border-left:4px solid #e0a531}
.story .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.story .sh b{font-size:15px;line-height:1.4}
.story .stg{font-size:10px;border-radius:5px;padding:1px 6px;color:#fff;flex:none}
.story .su{font-size:11px;color:#9a8f8c}

  .phone{width:min(360px,100%);aspect-ratio:auto;height:640px;margin:0 auto}

.bag{width:60%;height:60%;display:block}

/* 视觉小说 */
.vn{position:fixed;inset:0;z-index:58;display:none;background:#07060b;overflow:hidden;user-select:none;transition:opacity .6s ease}

.vn.dark .vn-bg{filter:brightness(.16) saturate(.5)}

function bullScript(stage,N){

  const riseTo=end=>{ while(d<end){ add("上升",Math.max(3,Math.min(end-d,ri(10,16)))); if(d<end-6&&Math.random()<0.45) add("平淡",ri(2,3)); } };

  else if(stage==="peak"){ riseTo(ri(2,5)); add("顶峰",ri(4,6)); add("下跌",ri(8,12)); }
  else { riseTo(ri(-15,-10)); add("顶峰",ri(3,4)); add("下跌",ri(5,7)); add("上升",ri(4,6)); add("顶峰",ri(2,3)); add("下跌",ri(10,14)); }

  while(d<=N+5){ st=pick(REGIMES[st].next); const R=REGIMES[st]; add(st,ri(R.len[0],R.len[1])); }
  return segs;

}

function genPath(open,mu,sig,lo,hi,spike,hard){
  const path=[open]; let p=open; const step=sig/Math.sqrt(MINUTES);
  const at=Math.floor(rnd(50,270)), amp=rnd(0.03,0.06)*(Math.random()<0.75?1:-1);
  // 封板：价格碰到涨停或跌停后会“粘”在那里，每分钟只有很小的概率开板。跌停比涨停更难打开
  const openUp = mu>0.03?0.004:mu>0.01?0.009:0.016, openDn = hard?0.0012: mu<-0.03?0.003:mu<-0.01?0.007:0.012;
  let pin = p>=hi*(1-1e-9)?1 : p<=lo*(1+1e-9)?-1 : 0;
  for(let i=1;i<=MINUTES;i++){
    if(pin===1){ if(Math.random()<openUp){ pin=0; p=hi*(1-rnd(0.004,0.025)); } else p=hi; path.push(p); continue; }
    if(pin===-1){ if(Math.random()<openDn){ pin=0; p=lo*(1+rnd(0.004,0.02)); } else p=lo; path.push(p); continue; }
    let r=(mu*0.75)/MINUTES+step*gauss();
    if(spike && i>=at && i<at+8) r+=amp/8;              // 20 秒拉升
    if(spike && i>=at+8 && i<at+70) r-=amp*0.55/62;     // 回落
    p=p*(1+r);
    if(p>=hi){ p=hi; pin=1; } else if(p<=lo){ p=lo; pin=-1; }
    path.push(p);
  }
  return path;
}

/* 个股当日漂移：大盘 × beta + 主题阶段 × 确定性 + 敌对周期抽血 + 自身噪声 */
function stockDrift(s,idxRet,volState,tp,R){
  let m=s.beta*idxRet, volx=1;
  if(s.indep) m+=s.indep;
  const ph=s.theme?tp[s.theme]:null;
  let c=s.base, tier=null;
  if(ph && !s.indep){ const early=ph.name==="酝酿"||ph.name==="启动"; c= early? rnd(0.35,0.65) : ph.cycle.cert[s.code]; if(!early) tier=ph.cycle.tier[s.code]; }
  if(idxRet>0){ if(volState==="放量") c+= s.capTier==="大"?0.12:s.capTier==="中"?0.03:-0.06; else if(volState==="缩量") c+= s.capTier==="大"?-0.06:s.capTier==="小"?0.08:0; }
  else { c+= s.capTier==="小"?-0.05:s.capTier==="大"?0.03:0; }
  c=Math.max(0.05,Math.min(0.95,c)); s.cToday=c; s.tierToday=tier;
  if(ph && !s.indep){
    let dr=ph.drift, mult=1;
    if(tier){ const tm=TIER_MULT[tier][ph.name]; if(tm==="lift") dr=0.012; else if(tm!=null) mult=tm; }
    m+= dr>0? dr*mult*(0.4+0.8*c) : dr*mult*(1.4-0.8*c);
    if(ph.name==="高潮"||ph.name==="分歧") volx=1.5;
  }
  if(s.theme){const h=tp[TH(s.theme).hostile]; if(h&&(h.name==="主升"||h.name==="高潮")) m-=0.008*(1.2-c);}
  m+=gauss()*0.006; s.mu=m; s.volx=volx*(R.vol>0.012?1.2:1);
  return m;
}
const volF=v=>v==="放量"?1.5:v==="缩量"?0.65:1;
function candle(o,c,sig,vol,cap){ return {o,c,h:Math.max(o,c)*(1+Math.abs(gauss())*sig*0.35),l:Math.min(o,c)*(1-Math.abs(gauss())*sig*0.35),v:cap*0.002*(1+Math.abs(c/o-1)*25)*volF(vol)*rnd(0.8,1.2)}; }
/* 开局前 60 个交易日的历史行情：用同一套大盘、周期、个股规则逐日生成 */
function genHistory(){
  let iv=3000*rnd(0.95,1.08); S.index.k=[];
  S.stocks.forEach(s=>{ s.k=[]; s.price=s.p; });
  for(let d=-59; d<=0; d++){
    const st=S.world.reg[d]||"平淡", R=REGIMES[st], idxRet=R.drift+R.vol*gauss(), vol=S.world.vols[d]||"平量";
    const io=iv*(1+gauss()*R.vol*0.2), ic=iv*(1+idxRet); S.index.k.push(candle(io,ic,R.vol,vol,40000)); iv=ic;
    const tp={}; for(const k in S.themes) tp[k]=phaseAt(k,d);
    S.stocks.forEach(s=>{
      const m=stockDrift(s,idxRet,vol,tp,R), sig=s.vol*(1.3-0.5*s.cToday)*s.volx;
      const o=s.price*(1+m*0.25+gauss()*sig*0.25), c=s.price*Math.max(0.8,Math.min(1.2,1+m*0.75+gauss()*sig));
      s.k.push(candle(Math.max(s.price*0.8,Math.min(s.price*1.2,o)),c,sig,vol,s.cap)); s.price=c;
    });
  }
  S.index.val=S.index.prev=iv; S.index.path=[iv];
  S.stocks.forEach(s=>{ s.prev=s.price; s.path=[s.price]; s.hist=s.k.map(x=>x.c); });
}

function hotStock(){
  const d=S.day, hot=Object.keys(S.themes).filter(k=>live(k,d)&&(p=>p&&(p.name==="主升"||p.name==="高潮"))(phaseAt(k,d)));

}

function trade(kind,frac){
  if(S.phase!=="market"){toast("已经收盘了");return}
  const s=stock(S.sel);
  if(s.delisted){toast("已退市，无法交易");return}
  let f=frac;
  // 压力高时手抖
  if(S.stress>60 && Math.random()<(S.stress-60)/90){
    const order=[0.25,0.5,1]; const i=order.indexOf(f); if(kind==="buy"&&i>=0&&i<2){f=order[i+1]; setTimeout(()=>toast("手抖了，多买了一档"),900);}
  }
  const dayLoss = equity()/S.openEquity-1;
  if(dayLoss<=-0.05) deviate("P2","当天已亏超 5% 仍在交易");
  if(kind==="buy" && isLimUp(s)) return queueOrder(s,"buy",f);
  if(kind==="sell" && isLimDn(s)) return queueOrder(s,"sell",f);
  execTrade(s,kind,f,s.price,false);
  S.alertBase[s.code]=s.price;
  if(S.app==="stock") renderStockLive(true);
}
function isLimUp(s){ return !s.delisted && s.price>=s.prev*1.2*(1-1e-6); }
function isLimDn(s){ return !s.delisted && s.price<=s.prev*0.8*(1+1e-6); }

function queueOrder(s,kind,f){
  if(kind==="sell"){ const h=S.hold[s.code]; if(!h||!h.qty){toast("没有持仓");return} if(h.qty-(h.todayQty||0)<=0){toast("T+1：今天买入的股票，明天才能卖");return} }
  if(S.queue.some(o=>o.code===s.code&&o.kind===kind)){ toast("这只已经在排队了"); return; }
  S.queue.push({id:String(Date.now())+ri(0,999),code:s.code,kind,frac:f,minute:S.minute,day:S.day});
  if(kind==="buy") toast(`${s.name} 涨停封板，买单进入排队，前面还有很多人`);
  else { toast(`${s.name} 跌停封死，卖单排在几十万手后面`); S.stress=Math.min(stressCap(),S.stress+3); }
  if(S.app==="stock") renderStockLive(true);

/* 每分钟检查一次排队：封板时几乎排不到；一旦开板，排队的单子按涨停价（或跌停价）成交 */
function processQueue(){
  if(!S.queue.length) return;
  S.queue=S.queue.filter(o=>{
    const s=stock(o.code); if(s.delisted) return false;
    if(o.kind==="buy"){ const lu=s.prev*1.2, sealed=isLimUp(s);
      if(sealed && Math.random()>0.001) return true;
      const q=execTrade(s,"buy",o.frac,lu,true);
      if(!q) showBanner("涨","涨涨证券",`${s.name} 开板了，但你的钱不够按涨停价买一手，排队单作废`,"stock");
      if(q) showBanner("涨","涨涨证券", sealed?`排队买单成交：${s.name} 以涨停价 ${lu.toFixed(2)} 买入 ${q} 股`:`${s.name} 炸板了。你排队的买单以涨停价 ${lu.toFixed(2)} 成交 ${q} 股，现价 ${s.price.toFixed(2)}`,"stock");
      return false; }
    const ld=s.prev*0.8, sealed=isLimDn(s);
    if(sealed){ if((S.minute-o.minute)%30===29) S.stress=Math.min(stressCap(),S.stress+1.5); if(Math.random()>0.0005) return true; }
    const q=execTrade(s,"sell",o.frac,ld,true);
    if(q) showBanner("涨","涨涨证券",`${s.name} 跌停板打开了一瞬。你的卖单以跌停价 ${ld.toFixed(2)} 成交 ${q} 股`,"stock");
    return false;
  });
}
function execTrade(s,kind,f,px,silent){
  if(kind==="buy"){
    const amt = buyingPower()*f;
    const lots = Math.floor(amt/(px*100*1.001));
    if(lots<1){ if(!silent) toast("钱不够买一手（100 股）"); return 0; }
    const qty=lots*100, cost=qty*px, fe=fee(cost);
    if(px/s.prev-1>0.07) deviate("P5","追涨买入 "+s.name);
    S.cash -= cost+fe; S.fees+=fe;
    const h=S.hold[s.code]||{qty:0,cost:0,todayQty:0}; h.cost=(h.cost*h.qty+cost)/(h.qty+qty); h.qty+=qty; h.todayQty=(h.todayQty||0)+qty; S.hold[s.code]=h;
    if(h.qty*s.price > equity()*0.5) deviate("P1",s.name+" 超过总资产一半");
    S.trades.push({day:S.day,code:s.code,kind:"buy"});
    if(!silent){ toast(`买入 ${s.name} ${qty} 股`); sfx("coin"); }
    return qty;
  }
  const h=S.hold[s.code]; if(!h||!h.qty){ if(!silent) toast("没有持仓"); return 0; }
  const sellable=h.qty-(h.todayQty||0);
  if(sellable<=0){ if(!silent) toast("T+1：今天买入的股票，明天才能卖"); return 0; }
  let qty = f===1? sellable : Math.max(100,Math.floor(sellable*f/100)*100);
  qty=Math.min(qty,sellable);
  const got=qty*px, fe=fee(got);
  S.cash += got-fe; S.fees+=fe;
  S.sells.push({day:S.day,pnl:(px-h.cost)*qty-fe,viol:S.todayViolated});
  S.trades.push({day:S.day,code:s.code,kind:"sell"});
  h.realized=(h.realized||0)+(px-h.cost)*qty-fe; h.soldQty=(h.soldQty||0)+qty; h.sellAmt=(h.sellAmt||0)+got;
  h.qty-=qty; if(!h.qty){ recordClear(s,h,"卖出"); delete S.hold[s.code]; }
  if(!silent){ toast(`卖出 ${s.name} ${qty} 股`); sfx("coin"); }
  return qty;
}

  if(S.focusSess>=25){ S.focusSess=0; S.tomToday++; S.tomTotal++; S.tomLog.push("ok");
    const avg=S.qSum/Math.max(1,S.qN); S.qSum=0; S.qN=0;

  if(S.studyMode==="intern") addIntern(m); else S.ky.eff+=m;

}

/* ============ 主循环 ============ */
let timer=null, acc=0, last=0;
function loop(ts){
  if(S.phase!=="market"){timer=null;return}
  if(S.paused||S.frozen){ last=ts; timer=requestAnimationFrame(loop); return; }
  if(!last) last=ts;
  const dt=ts-last; last=ts;
  const sk=Math.min(1,(ts-(S.slowT||-1e9))/2600), sf=S.fast?1:0.3+0.7*sk*sk;   // 刚切换 App 的两三秒里，时间走得慢一些
  acc+=dt*sf; const tEl=$("#sb-time"); if(tEl) tEl.classList.toggle("slow",sf<0.95);
  if(performance.now()>clkCueT){ const k=curSpd(); if(k!==clkSpd){ clkSpd=k; setSpd(k); } }
  const per = S.fast? 40 : 170*paceF();
  while(acc>=per && S.phase==="market"){acc-=per; tickMinute();}
  timer=requestAnimationFrame(loop);
}
/* 体感时间：心流里一分钟过得更快；走神时，同样一分钟熬得更久 */
function streakX(){ return Math.pow(2,Math.min(3,Math.floor((S.streak||0)/4))); }
function sitX(){ return 1+0.8*Math.min(1,(S.sitMin||0)/90); }
function paceF(){ if(S.app!=="study") return 1; const hb=1/((1+0.6*(S.habit||0))*streakX()*sitX()); if(S.flow>0) return hb/(1+0.35*S.flow); const q=S.lastQ==null?1:S.lastQ; return (q<0.85? 1+(0.85-q)*1.2 : 1)*hb; }
/* 学习的习惯 0~1：每天收盘时按今天学了多久、看了多久盘结算；盘中每看 30 分钟盘也会掉一点 */

/* 计划：考研按二十天过完一轮的九成来算；实习按第 12 天截止前把作品和简历做完来算 */
function planNow(){
  const d=S.day, k=S.ky, r1=k.totalCh*k.minPerCh, it=S.it, intern=S.studyMode==="intern"||S.lean==="intern";
  const kyExp=Math.min(1,d/20)*0.9, kyAct=Math.min(1,k.eff/r1);
  const itExp=S.internState==="open"?Math.min(1,d/11):0, itAct=0.6*Math.min(1,it.proj/it.projNeed)+0.4*Math.min(1,it.emails/it.emailTarget);
  const kyGap=Math.max(0,kyExp-kyAct), itGap=S.internState==="open"?Math.max(0,itExp-itAct):0;
  return {intern,kyExp,kyAct,itExp,itAct,gap:intern?Math.max(itGap,kyGap*0.5):Math.max(kyGap,itGap*0.5)};
}
function goalGap(){ return planNow().gap; }
function reliefF(){ return 1/(1+2.5*(S.gap||0)); }     // 落下越多，放松越不管用
function stressAmp(){ return 1+1.2*(S.gap||0); }       // 落下越多，坏事越容易被放大
function planLine(){ const p=planNow(); return p.intern&&S.internState==="open"?`按计划，实习准备今天该到 ${Math.round(p.itExp*100)}%，你在 ${Math.round(p.itAct*100)}%`:`按计划，一轮今天该到 ${Math.round(p.kyExp*100)}%，你在 ${Math.round(p.kyAct*100)}%`; }
function habitAdd(v,why){
  const o=S.habit||0, n=Math.max(0,Math.min(1,o+v)); S.habit=n;
  const up=[0.3,0.6,0.85].find(t=>o<t&&n>=t), dn=[0.3,0.6].find(t=>o>=t&&n<t);
  if(up!=null) setTimeout(()=>toast(up>=0.85?"坐下来学习，已经成了你每天的一部分。专注时，时间过得飞快。":up>=0.6?"你越来越习惯坐下来了。专注的时候，时间过得更快。":"你开始习惯每天坐下来学习。专注时，时间会过得快一点。"),why==="close"?1200:300);
  if(dn!=null) setTimeout(()=>toast("看盘的时间多了。再坐下来，时间又变慢了。"),300);
}
function runMarket(){S.eveAct=null; S.phase="market"; last=0; acc=0; if(!timer) timer=requestAnimationFrame(loop);}

const CLK_MS={120:["11:30 · 上午过去了","11:30 · 上午过去了"],210:["13:00 · 下午开盘","13:00 · 下午了"],300:["14:30 · 离收盘还有半小时","14:30 · 今天还剩半小时"],325:["14:55 · 还有 5 分钟收盘","14:55 · 还有 5 分钟"]};
function tickMinute(){

  if(a==="stock" && S.loc==="class"){ if(++S.stockStreak>=120){ S.loc="dorm"; toast("你从教室溜回了宿舍"); } } else S.stockStreak=0;

      h.realized=(h.realized||0)+(s.price-h.cost)*h.qty-fe; h.soldQty=(h.soldQty||0)+h.qty; h.sellAmt=(h.sellAmt||0)+g; recordClear(s,h,"强制平仓");});
    S.hold={}; S.liquidated=wasPz?"pz":"margin"; S.stress=Math.min(stressCap(),S.stress+(wasPz?35:25));

  }
  // 推送诱惑
  if(S.app!=="stock"){
    S.alertLv=S.alertLv||{};
    for(const c in S.hold){const s=stock(c), r=dayChg(s), lv=r>=0.095?4:r>=0.06?3:r>=0.03?2:r<=-0.095?-4:r<=-0.06?-3:r<=-0.03?-2:0, k=c+"@"+S.day, was=S.alertLv[k]||0;

function hrTarget(){

    if(S.app==="stock"){ t+=6; const r=Math.abs(todayPL())/DAILY_INCOME; t+=Math.min(24,Math.log(1+r)*6.5); }
    else if(PHONE_SIDE.has(S.app)) t+=2;
    if(S.app==="study"&&S.flow) t-=4+S.flow;
    if(p==="market"&&(S.paused||S.minute<S.cryUntil)) t=126+S.stress*0.2;

}

function renderSurvey(step){
  step=step||1;
  if(step===1){
    setView(`<div class="eyebrow">涨涨证券 · 开户 1/3 · 风险承受能力测评</div>
      <h1 style="font-size:28px;margin-top:6px">先评估一下你能承受多少风险</h1>
      <p class="small">第一次打开涨涨证券，要先开户。开户期间，游戏时间暂停。</p>
      ${RISK_Q.map((x,i)=>`<div class="q"><div class="small">${i+1}. ${x.q}</div>${x.o.map((t,j)=>`<label class="opt"><input type="radio" name="rq${i}" id="rq${i}_${j}" value="${x.w?x.w[j]:j}">${t}</label>`).join("")}</div>`).join("")}
      <button class="btn gold" id="nx" type="button">下一步</button>`,"intro");
    $("#nx").onclick=()=>{
      const v=RISK_Q.map((x,i)=>document.querySelector(`input[name=rq${i}]:checked`));
      if(v.some(x=>!x)){toast("请回答全部问题");return}
      const sc=v.reduce((a,x)=>a+ +x.value,0);
      const lv = sc<=1?["C1","保守型"]:sc<=3?["C2","稳健型"]:sc<=5?["C3","平衡型"]:sc<=7?["C4","成长型"]:["C5","进取型"];
      S.riskLevel=lv[0]; S.selfType=lv[0]+" "+lv[1];
      sheet(`<div class="eyebrow">测评结果</div><h3>你的风险承受等级：${lv[0]} ${lv[1]}</h3>
        <p>${sc>=6?"系统提示：你的风险偏好较高。股票投资可能亏损全部本金，请勿使用生活费或借款投资。":"系统会按你的等级推荐产品。等级只描述你现在怎么想，不代表你以后会怎么做。"}</p>
        <button class="btn primary" data-c="ok" type="button">继续</button>`,()=>{closeSheet(); renderSurvey(2);});
    };
    return;
  }
  if(step===2){
    setView(`<div class="eyebrow">涨涨证券 · 开户 2/3 · 交易知识测验</div>
      <h1 style="font-size:28px;margin-top:6px">确认你了解交易规则</h1>
      ${QUIZ.map((x,i)=>`<div class="q"><div class="small">${i+1}. ${x.q}</div>${x.o.map((t,j)=>`<label class="opt"><input type="radio" name="qz${i}" id="qz${i}_${j}" value="${j}">${t}</label>`).join("")}<p class="fb" id="fb${i}" hidden></p></div>`).join("")}
      <button class="btn gold" id="nx" type="button">下一步</button>`,"intro");
    QUIZ.forEach((x,i)=>document.querySelectorAll(`input[name=qz${i}]`).forEach(r=>r.addEventListener("change",()=>{
      const ok=+r.value===x.a, fb=$("#fb"+i); fb.hidden=false; fb.className="fb "+(ok?"ok":"no"); fb.textContent=(ok?"回答正确。":`不对，正确答案是「${x.o[x.a]}」。`)+x.e;
    })));
    $("#nx").onclick=()=>{
      const v=QUIZ.map((x,i)=>document.querySelector(`input[name=qz${i}]:checked`));
      if(v.some(x=>!x)){toast("请回答全部问题");return}
      S.quizScore=QUIZ.filter((x,i)=>+v[i].value===x.a).length; renderSurvey(3);
    };
    return;
  }
  setView(`<div class="eyebrow">涨涨证券 · 开户 3/3 · 给自己定规矩</div>
    <h1 style="font-size:28px;margin-top:6px">最后，给自己定几条规矩</h1>
    <p class="small">最多 3 条。系统会记录你有没有做到，但不会拦你。</p>
    <div class="q">${PRINCIPLES.map(p=>`<label class="opt"><input type="checkbox" id="pr-${p.id}" value="${p.id}">${p.t}</label>`).join("")}</div>
    <p class="small">你的专业是「${esc(S.major.name)}」。今年要么考研，要么找实习，要么……</p>
    <button class="btn gold" id="go2" type="button">完成开户，进入行情</button>`,"intro");
  document.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener("change",()=>{
    const on=[...document.querySelectorAll('input[type=checkbox]:checked')]; if(on.length>3){cb.checked=false;toast("最多 3 条");}
  }));
  $("#go2").onclick=()=>{
    S.principles=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);
    S.accountOpen=true; S.frozen=false; toast("开户成功"); openApp("stock");
  };
}

function storiesFor(d){
  const out={comm:[],news:[]}, ls=vary("lossS",LOSS_STORY), ls2=d%3===0?vary("lossS",LOSS_STORY):null;

  out.comm.push({story:true,src:"散户故事",u:ls[0],title:ls[1],text:ls[2],likes:`${ri(2,40)*10}`});
  if(ls2) out.comm.push({story:true,src:"散户故事",u:ls2[0],title:ls2[1],text:ls2[2],likes:`${ri(2,40)*10}`});
  if(d%2===1) out.comm.push({story:true,src:"大V言论",u:"财经大V",title:"",text:vary("bigM",BIG_MONEY)(),likes:`${ri(1,9)}千`});

function commCm(n){
  if(n.cm2) return n.cm2;
  const nm=n.code&&n.code!=="IDX"?stock(n.code).name:"这只";
  const P=n.story?(n.src==="大V言论"||n.src==="机构观点"?CM_BIG:n.pin?null:CM_STORY):n.dir<0?CM_BEAR:OFFICIAL.has(n.src)?CM_OFF:CM_HYPE;
  const out=(n.cm||[]).map(t=>({u:CM_USERS[ri(0,CM_USERS.length-1)],t}));
  if(P){ const k=ri(3,5), used=new Set(); let g=0; while(out.length<k+(n.cm?n.cm.length:0)&&g++<40){ const t=P[ri(0,P.length-1)]; if(used.has(t)) continue; used.add(t); out.push({u:CM_USERS[ri(0,CM_USERS.length-1)],t:t.replace("{S}",nm),lk:ri(0,60)}); } }
  n.likes2=n.likes2||ri(5,400);
  return n.cm2=out;
}

/* 前一天越热、周期越大，第二天早上的推送就越大越强烈；正文仍要点开 App 才能看到 */
function heatPushes(d){
  if(d<1) return {html:""};
  const SZ={small:1,medium:2,large:3}, PW={"高潮":1,"主升":0.55,"分歧":0.4,"启动":0.2};
  const list=[];
  for(const k in S.themes){
    const ph=live(k,d-1)?phaseAt(k,d-1):null; if(!ph||!PW[ph.name]) continue;
    const mem=S.stocks.filter(x=>x.theme===k&&x.hist.length>=2&&!x.delisted); if(!mem.length) continue;
    const ret=mem.reduce((a,x)=>a+x.hist[x.hist.length-1]/x.hist[x.hist.length-2]-1,0)/mem.length;
    const lim=mem.filter(x=>x.hist[x.hist.length-1]/x.hist[x.hist.length-2]-1>0.095).length;
    const score=SZ[ph.cycle.size]*PW[ph.name]*Math.max(0.2,1+ret*12);
    if(ret>0) list.push({k,ret,lim,score,lead:stock(ph.cycle.leader)});
  }
  list.sort((a,b)=>b.score-a.score);
  let viaStore=false;
  const html=list.slice(0,3).map(x=>{
    const T=TH(x.k).name, n=Math.round(800+x.score*900);
    const tgt=x.score>=1.5&&x.score<3?"news":"comm";
    if(!S.installed[tgt]){ if(viaStore) return ""; viaStore=true; return `<button class="notif" type="button" data-push="store"><span class="ic" style="background:#2f6bf2;color:#fff">${BAG}</span><span><span class="src">应用商店 · 财经热榜</span><br>「${tgt==="news"?"财讯":"股友社区"}」：${esc(T)}昨日${x.lim?` ${x.lim} 股涨停`:`大涨 ${(x.ret*100).toFixed(1)}%`}，${n.toLocaleString("zh-CN")} 人在看</span></button>`; }
    if(x.score>=3) return `<button class="hpush lv3" type="button" data-push="comm"><span class="hp-tag">股友社区 · 热榜第一</span><b>${esc(T)}昨日${x.lim?`${x.lim} 股涨停`:`大涨 ${(x.ret*100).toFixed(1)}%`}！</b><span>${n.toLocaleString("zh-CN")} 人正在讨论，点开查看</span></button>`;
    if(x.score>=1.5) return `<button class="hpush lv2" type="button" data-push="news"><span class="hp-tag">财讯 · 要闻</span><b>${esc(T)}板块昨日走强 ${(x.ret*100).toFixed(1)}%</b><span>点开查看详情</span></button>`;
    return `<button class="notif" type="button" data-push="comm"><span class="ic" style="background:#e0524a;color:#fff">股</span><span><span class="src">股友社区</span><br>有人在聊${esc(T)}。</span></button>`;
  }).join("");
  return {html};
}

function drawKChart(s){

  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  let ks=s.k.slice(-60);
  if(S.phase==="market"&&!s.delisted){ const p=s.path.slice(0,S.minute+1); ks=[...ks.slice(-59),{o:p[0],h:Math.max(...p),l:Math.min(...p),c:s.price,v:0,today:true}]; }
  const n=ks.length, pw=w-44, ph=h*0.7, vh=h*0.18, vy=h-vh-12;
  const hi=Math.max(...ks.map(x=>x.h)), lo=Math.min(...ks.map(x=>x.l)), Y=v=>6+(hi-v)/(hi-lo||1)*(ph-6), cwid=pw/n;
  const vmax=Math.max(...ks.map(x=>x.v||0))||1;
  g.strokeStyle="#2e2b3a"; g.lineWidth=1; [0.25,0.5,0.75].forEach(f=>{ g.beginPath(); g.moveTo(0,6+f*(ph-6)); g.lineTo(pw,6+f*(ph-6)); g.stroke(); });
  ks.forEach((k,i)=>{ const x=i*cwid+cwid/2, up=k.c>=k.o, col=up?"#ef4a52":"#27b36b";
    g.strokeStyle=col; g.beginPath(); g.moveTo(x,Y(k.h)); g.lineTo(x,Y(k.l)); g.stroke();
    const bw=Math.max(1,cwid*0.65), y1=Y(Math.max(k.o,k.c)), y2=Y(Math.min(k.o,k.c));
    g.fillStyle=col; g.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1));
    if(k.v){ const vhh=k.v/vmax*vh; g.globalAlpha=.55; g.fillRect(x-bw/2,vy+vh-vhh,bw,vhh); g.globalAlpha=1; }
    if(k.today){ g.strokeStyle="#f2b544"; g.strokeRect(x-bw/2-1.5,Y(k.h)-2,bw+3,Y(k.l)-Y(k.h)+4); } });
  const ma=(len,col)=>{ g.strokeStyle=col; g.lineWidth=1.2; g.beginPath(); let st=false; ks.forEach((k,i)=>{ if(i<len-1) return; const a=ks.slice(i-len+1,i+1).reduce((t,x)=>t+x.c,0)/len; const x=i*cwid+cwid/2; st?g.lineTo(x,Y(a)):(g.moveTo(x,Y(a)),st=true); }); g.stroke(); };
  ma(5,"#f2d06b"); ma(20,"#b48ce0");
  g.fillStyle="#7d7890"; g.font="10px IBM Plex Mono, monospace"; g.textAlign="left";
  g.fillText(hi.toFixed(2),pw+4,12); g.fillText(lo.toFixed(2),pw+4,ph); g.fillText("MA5",4,h-2); g.fillStyle="#b48ce0"; g.fillText("MA20",34,h-2);
  g.fillStyle="#7d7890"; g.textAlign="right"; g.fillText(S.phase==="market"?"今天":"昨天",pw,h-2); g.textAlign="center"; g.fillText("60 个交易日",pw/2,h-2);
  if(S.hoverX!=null && S.hoverX>=0 && S.hoverX<pw){   // 悬停：这一天的开高低收、涨跌幅、振幅、成交额
    const i=Math.max(0,Math.min(n-1,Math.floor(S.hoverX/cwid))), k=ks[i], x=i*cwid+cwid/2;
    const base=s.k.length-(ks.at(-1).today?59:60), idx=base+i, day=idx-59;
    const prevC = i>0? ks[i-1].c : (s.k[idx-1]||k).o;
    const lab = k.today? `第 ${S.day} 天（今天，盘中）` : day>=1? `第 ${day} 天` : `开局前 ${1-day} 天`;
    g.strokeStyle="rgba(236,232,242,.35)"; g.setLineDash([3,3]); g.beginPath(); g.moveTo(x,4); g.lineTo(x,ph); g.moveTo(0,Y(k.c)); g.lineTo(pw,Y(k.c)); g.stroke(); g.setLineDash([]);
    const chg=k.c/prevC-1, amp=(k.h-k.l)/prevC, rows=[lab,`开 ${k.o.toFixed(2)}  高 ${k.h.toFixed(2)}`,`低 ${k.l.toFixed(2)}  收 ${k.c.toFixed(2)}`,`涨跌 ${pct(chg)}  振幅 ${(amp*100).toFixed(2)}%`,`成交额 ${k.today?"—":k.v.toFixed(2)+" 亿"}`];
    const bw2=150, bh=rows.length*14+10, bx=x+10+bw2>pw? x-10-bw2 : x+10, by=6;
    g.fillStyle="rgba(18,17,24,.94)"; g.strokeStyle="#3a3646"; g.fillRect(bx,by,bw2,bh); g.strokeRect(bx+.5,by+.5,bw2-1,bh-1);
    g.textAlign="left"; g.font="10.5px IBM Plex Mono, monospace";
    rows.forEach((t,j)=>{ g.fillStyle= j===0?"#f2b544": j===3?(chg>0?"#ff8a90":chg<0?"#6fe0a4":"#cfcadb") : "#cfcadb"; g.fillText(t,bx+8,by+16+j*14); });
  }
}
function drawChart(s){
  if(S.chartMode==="day") return drawKChart(s);
  const cv=$("#cv"); if(!cv) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth||360, h=150;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const pts=["market","after","evening","report"].includes(S.phase)?s.path.slice(0,S.minute+1):[s.price];   // 盘前、竞价：只有一个参考价
  let lo=Math.min(s.prev,...pts), hi=Math.max(s.prev,...pts); const span=Math.max(hi-lo,s.prev*0.02); const mid=(hi+lo)/2; lo=mid-span*0.6; hi=mid+span*0.6;
  const X=i=>i/MINUTES*(w-44), Y=p=>8+(hi-p)/(hi-lo)*(h-24);
  g.strokeStyle="#2e2b3a"; g.lineWidth=1; g.setLineDash([3,4]);
  g.beginPath(); g.moveTo(0,Y(s.prev)); g.lineTo(w-44,Y(s.prev)); g.stroke(); g.setLineDash([]);
  g.fillStyle="#7d7890"; g.font="10px IBM Plex Mono, monospace"; g.textAlign="left";
  g.fillText(hi.toFixed(2),w-40,14); g.fillText(lo.toFixed(2),w-40,h-14); g.fillText(s.prev.toFixed(2),w-40,Y(s.prev)+3);
  g.fillText("9:30",0,h-2); g.textAlign="center"; g.fillText("11:30/13:00",X(165),h-2); g.textAlign="right"; g.fillText("15:00",w-44,h-2);
  const up=s.price>=s.prev, col=up?"#ef4a52":"#27b36b";
  g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(X(i),Y(p)):g.moveTo(X(i),Y(p)));
  g.strokeStyle=col; g.lineWidth=1.6; g.stroke();
  g.lineTo(X(pts.length-1),h-14); g.lineTo(0,h-14); g.closePath();
  const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,up?"rgba(239,74,82,.28)":"rgba(39,179,107,.28)"); gr.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=gr; g.fill();
  const lx=X(pts.length-1), ly=Y(pts[pts.length-1]); g.beginPath(); g.arc(lx,ly,3,0,Math.PI*2); g.fillStyle=col; g.fill();
  if(S.hoverX!=null && S.hoverX>=0 && S.hoverX<=w-44 && pts.length>1){   // 悬停：这一分钟的价格
    const i=Math.max(0,Math.min(pts.length-1,Math.round(S.hoverX/(w-44)*MINUTES))), p=pts[i], x=X(i), y=Y(p);
    g.strokeStyle="rgba(236,232,242,.35)"; g.setLineDash([3,3]); g.beginPath(); g.moveTo(x,4); g.lineTo(x,h-14); g.moveTo(0,y); g.lineTo(w-44,y); g.stroke(); g.setLineDash([]);
    const c=p/s.prev-1, rows=[clockStr(i),`价格 ${p.toFixed(2)}`,`涨跌 ${pct(c)}`], bw2=112, bh=rows.length*14+10, bx=x+10+bw2>w-44? x-10-bw2 : x+10;
    g.fillStyle="rgba(18,17,24,.94)"; g.strokeStyle="#3a3646"; g.fillRect(bx,6,bw2,bh); g.strokeRect(bx+.5,6.5,bw2-1,bh-1);
    g.textAlign="left"; g.font="10.5px IBM Plex Mono, monospace"; rows.forEach((t,j)=>{ g.fillStyle=j===0?"#f2b544":j===2?(c>0?"#ff8a90":c<0?"#6fe0a4":"#cfcadb"):"#cfcadb"; g.fillText(t,bx+8,22+j*14); });
  }
}

const SHOT_CACHE={};
function shotImg(v){

  c.fillStyle="#fff7f6"; c.fillRect(0,0,360,260); c.fillStyle="#e0524a"; c.fillRect(0,0,360,44);

const levNow=()=>S.pz?S.pz.lev:(S.leverage?2:1);
const loanOwed=()=>(S.loans||[]).reduce((a,l)=>a+loanDue(l),0);
const canBreak=()=>levNow()>=5&&loanOwed()>0;
const stressCap=()=>canBreak()?100:94;
function stressTier(v){ const x=v==null?S.stress:v; return x>=80?3:x>=60?2:x>=40?1:0; }
const TIER_N=["放松","紧绷","焦虑","崩溃边缘"];

/* ============ 借钱炒股：秒借（网贷）、倍增宝（配资） ============
   都是虚构的 App。网贷：到手少一截（服务费），七天后连本带息还；还不上就逾期、罚息、催收，最后电话打到妈妈那里。
   配资：五倍、十倍的仓位，管理费按额度每天收；跌几个点就被强平。 */
const LOAN_OPTS=[2000,5000,10000], LOAN_FEE=0.04, LOAN_RATE=0.0005, LOAN_DAYS=7, LOAN_LIMIT=20000;
function loanDue(l){ if(l.paid) return 0; const days=Math.max(0,S.day-l.d); const late=Math.max(0,S.day-l.due); return Math.round(l.amt*(1+LOAN_RATE*days)+l.amt*0.002*late); }
function loanLockPush(d,items){
  if(!S.installed.stock||S.installed.loan) return;

  const od=(S.loans||[]).filter(l=>!l.paid&&S.day>l.due);
  if(od.length) items.unshift({ic:"借",c:"#a32a2a",src:"短信 · 秒借",t:`您的借款已逾期 ${S.day-od[0].due} 天，应还 ${fmt(loanOwed())}。请立即还款，以免影响征信及联系您的紧急联系人。`});
}
function renderLoan(){
  const owed=loanOwed(), act=(S.loans||[]).filter(l=>!l.paid), od=act.some(l=>S.day>l.due), room=Math.max(0,LOAN_LIMIT-act.reduce((a,l)=>a+l.amt,0));
  setView(`<div class="h-app"><button class="back" id="bk" type="button" aria-label="返回">‹</button><h2>秒借</h2><span class="small">3 分钟到账</span></div>
    <div class="ln-card"><div class="small">可借额度</div><div class="ln-big">${fmt(room)}</div><div class="small">日息低至 0.05% · 借 1 万每天只要 5 块</div></div>
    ${act.length?`<div class="ln-sec">待还</div>${act.map(l=>{ const due=loanDue(l), late=S.day>l.due; return `<div class="ln-row ${late?"late":""}"><span><b>${fmt(due)}</b><small>借 ${fmt(l.amt)} · 第 ${l.d} 天借 · ${late?`已逾期 ${S.day-l.due} 天`:`第 ${l.due} 天到期`}</small></span><button class="btn" type="button" data-pay="${l.id}" ${S.cash>=due?"":"disabled"}>还款</button></div>`; }).join("")}`:""}
    <div class="ln-sec">借一笔</div>
    ${LOAN_OPTS.map(a=>`<div class="ln-row"><span><b>借 ${fmt(a)}</b><small>到手 ${fmt(Math.round(a*(1-LOAN_FEE)))} · ${LOAN_DAYS} 天后还 ${fmt(Math.round(a*(1+LOAN_RATE*LOAN_DAYS)))}</small></span><button class="btn" type="button" data-borrow="${a}" ${a>room||od?"disabled":""}>${od?"逾期中":"立即借"}</button></div>`).join("")}
    <p class="ln-fine">借款服务费 ${LOAN_FEE*100}%，从到账金额中扣除。按 7 天计，综合年化约 ${Math.round(((LOAN_FEE+LOAN_RATE*LOAN_DAYS)/(1-LOAN_FEE))*365/LOAN_DAYS*100)}%。逾期罚息每日 0.2%，并可能联系您的紧急联系人。</p>
    ${owed?`<p class="ln-fine">你现在一共欠 ${fmt(owed)}。</p>`:""}`,"loan");
  $("#pview #bk").onclick=phoneBack;
  document.querySelectorAll("#pview [data-borrow]").forEach(b=>b.onclick=()=>loanBorrow(+b.dataset.borrow));
  document.querySelectorAll("#pview [data-pay]").forEach(b=>b.onclick=()=>loanPay(b.dataset.pay));
}
function loanBorrow(a){
  const get=Math.round(a*(1-LOAN_FEE));
  sheet(`<div class="eyebrow">秒借</div><h3>借 ${fmt(a)}</h3><p class="shop-pay">到手 ${fmt(get)}</p><p class="dim">${LOAN_DAYS} 天后（第 ${S.day+LOAN_DAYS} 天）还 ${fmt(Math.round(a*(1+LOAN_RATE*LOAN_DAYS)))}。\n这是奶茶店打工 ${Math.round(a/HOUR_WAGE)} 小时的钱。</p>

    S.numb=Math.min(1,(S.numb||0)+0.08); S.stress=Math.min(stressCap(),S.stress+3*stressAmp()); hrKick(8); sfx("coin");

function loanPay(id){
  const l=S.loans.find(x=>x.id===id); if(!l||l.paid) return; const due=loanDue(l);
  if(S.cash<due){ toast("卡里的钱不够"); return; }
  S.cash-=due; S.openEquity-=due; l.paid=true; l.paidD=S.day; l.paidAmt=due; S.loanFees+=due-l.amt;
  S.stress=Math.max(0,S.stress-4*reliefF()); sfx("coin"); toast(`已还 ${fmt(due)}`); if(S.app==="loan") renderLoan(); updateChrome();

/* 每天早上：到期自动扣款；扣不了就逾期，第三天电话打到妈妈那里 */
function loanMorning(d){
  for(const l of (S.loans||[])){

    if(d===l.due&&S.cash>=due){ S.cash-=due; l.paid=true; l.paidD=d; l.paidAmt=due; S.loanFees+=due-l.amt; S.autoPaid=(S.autoPaid||[]).concat([{d,amt:due}]); continue; }
    if(d>l.due){ S.stress=Math.min(stressCap(),S.stress+6); S.overdueDays=(S.overdueDays||0)+1;

const pzDrop=lev=>{ const m={2:0.3,5:0.13,10:0.07}[lev], e=1/lev; return Math.max(1,Math.round((e-m)/(1-m)*100)); };   // 满仓时跌多少会被强平

function pzApply(lev){

/* 收盘：配资管理费、融资利息；杠杆和欠款本身就让人睡不着 */
function levClose(lines){
  let fee=0;
  if(S.pz){ fee=Math.round(S.creditLine*S.pz.rate); S.cash-=fee; S.pzFees+=fee; S.pzDays=(S.pzDays||0)+1; }

  if(levNow()>=5){ S.stress+=4*stressAmp(); }
  const ow=loanOwed(); if(ow>0){ S.stress+=(S.loans.some(l=>!l.paid&&S.day>l.due)?8:3)*stressAmp(); lines.push(`你还欠秒借 ${fmt(ow)}。${S.loans.some(l=>!l.paid&&S.day>=l.due-1)?"马上就到期了。":""}`); }

}

/* ============ 周期真相图 ============ */
const PH_COL={"酝酿":"#d9cfb8","启动":"#f0c987","主升":"#ef8a5a","分歧":"#c4a3cf","高潮":"#d9434b","退潮":"#7fae96"};
const RG_COL={"上升":"#ef8a5a","顶峰":"#d9434b","下跌":"#7fae96","低谷":"#4f8a72","平淡":"#d9cfb8"};
function truthChart(n){
  const shown=Object.keys(S.themes).filter(k=>S.world.cycles.some(c=>c.theme===k&&c.start<=n&&c.end>=1)&&live(k,n))
    .sort((a,b)=>(S.watch.includes(b)-S.watch.includes(a)));
  const rows=[["大盘",null],...shown.map(k=>[TH(k).name+(TH(k).isNew?"·新":""),k])], cw=Math.max(12,Math.floor(300/Math.max(n,1))), lw=72, rh=20, W=lw+cw*n+6, H=rows.length*rh+22;
  let g="";
  rows.forEach(([nm,k],ri_)=>{
    const y=ri_*rh+4;
    g+=`<text x="0" y="${y+14}" font-size="10" fill="#4a4652">${nm}</text>`;
    for(let d=1;d<=n;d++){
      let col="#efece6", lab="";
      if(!k){const st=S.world.reg[d]; col=RG_COL[st]||col;}
      else{const ph=phaseAt(k,d); if(ph){col=PH_COL[ph.name];}}
      g+=`<rect x="${lw+(d-1)*cw}" y="${y}" width="${cw-1}" height="${rh-4}" fill="${col}"/>`;
    }
    if(k) S.trades.filter(t=>stock(t.code).theme===k).forEach(t=>{const x=lw+(t.day-0.5)*cw; g+= t.kind==="buy"?`<path d="M${x-4},${y+rh-6} L${x+4},${y+rh-6} L${x},${y+4} Z" fill="#1d1c22"/>`:`<path d="M${x-4},${y+4} L${x+4},${y+4} L${x},${y+rh-6} Z" fill="#1d1c22" opacity=".55"/>`;});
  });
  for(let d=1;d<=n;d++) if(d===1||d%5===0) g+=`<text x="${lw+(d-0.5)*cw}" y="${H-4}" font-size="9" text-anchor="middle" fill="#7d7887">${d}</text>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,560)}px" role="img" aria-label="周期真相图">${g}</svg>`;
  const legend=[...Object.entries(PH_COL).map(([k,c])=>`<span><i style="display:inline-block;width:10px;height:10px;background:${c};margin-right:4px;vertical-align:-1px"></i>${k}</span>`)].join("");
  // 买点落在哪个阶段
  const cnt={early:0,main:0,late:0,ebb:0,none:0};
  S.trades.filter(t=>t.kind==="buy").forEach(t=>{const s=stock(t.code); if(!s.theme){cnt.none++;return;} const ph=phaseAt(s.theme,t.day); if(!ph){cnt.none++;return;}
    if(ph.name==="酝酿"||ph.name==="启动") cnt.early++; else if(ph.name==="主升") cnt.main++; else if(ph.name==="退潮") cnt.ebb++; else cnt.late++;});
  const nb=S.trades.filter(t=>t.kind==="buy").length;
  let text = nb? `你一共买入 ${nb} 次：在酝酿或启动期 ${cnt.early} 次，主升期 ${cnt.main} 次，分歧或高潮期 ${cnt.late} 次，退潮期 ${cnt.ebb} 次，不在任何周期里 ${cnt.none} 次。` : "你这一局没有买入。";
  text = `这一局开局时，股市处在「${BULL_NAME[S.world.bull]||"震荡"}」。` + text + " 回头看，周期一清二楚。身在其中时，你看到的只是每天早上的那些消息。";
  const cr=S.world.cycles.find(c=>c.crossed&&c.start<=n); if(cr) text+=` 这一局出现了少见的周期穿越：${TH(cr.theme).name}板块在高潮之后没有退潮，又走了一段。`;
  const seen=S.world.cycles.filter(c=>c.start<=n&&c.end>=1&&live(c.theme,n)&&c.phases.some(p=>p.name==="主升"&&p.from<=n)).slice(0,4);
  if(seen.length) text+=" 每一轮周期的真相："+seen.map(c=>{const by=t=>Object.keys(c.tier).filter(k=>c.tier[k]===t).map(k=>stock(k).name); const b=by("补涨");
    return `${TH(c.theme).name}这一轮是「${c.driver}」，龙头是「${by("龙头").join("、")}」（${stock(c.leader).role}）${b.length?`，补涨的是「${b.join("、")}」`:""}`;}).join("；")+"。";
  const nt=Object.values(S.themes).filter(t=>t.isNew&&t.emergeDay!=null&&t.emergeDay<=n);
  if(nt.length) text+=" 这一局新出现的题材："+nt.map(t=>`「${t.name}」第 ${Math.max(1,t.emergeDay)} 天开始酝酿，${S.knownDay[t.id]?`你第 ${S.knownDay[t.id]} 天才第一次见到它`:"你始终没有注意到它"}`).join("；")+"。";
  S.swanLog.forEach(w=>{const s=stock(w.code), sw=S.world.swans.find(x=>x.code===w.code&&x.day===w.day); const res={delist:"被终止上市",crash:"开盘暴跌",surge:"重组复牌暴涨"}[w.kind];
    text+=` 第 ${w.day} 天，${s.name}${res}${w.held?"，当时你持有它":""}。${sw&&sw.warn.length?`在那之前的第 ${sw.warn.filter(x=>x>=1).join("、")} 天，有公告提示过风险。`:"之前没有任何预兆，这就是黑天鹅。"}`;});
  return {svg,legend,text};
}

function rgb2hsl(r,g,b){ r/=255; g/=255; b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn;
  if(d<1e-6) return [0,0,l]; const s=d/(1-Math.abs(2*l-1)); let h= mx===r? ((g-b)/d)%6 : mx===g? (b-r)/d+2 : (r-g)/d+4; h*=60; if(h<0) h+=360; return [h,Math.min(1,s),l]; }
function hsl2rgb(h,s,l){ const c=(1-Math.abs(2*l-1))*s, hp=(((h%360)+360)%360)/60, x=c*(1-Math.abs(hp%2-1)), m=l-c/2; let r=0,g=0,b=0;
  if(hp<1){r=c;g=x;} else if(hp<2){r=x;g=c;} else if(hp<3){g=c;b=x;} else if(hp<4){g=x;b=c;} else if(hp<5){r=x;b=c;} else {r=c;b=x;}
  return [(r+m)*255,(g+m)*255,(b+m)*255]; }
/* 换色：保留原图的明暗和笔触，只把色相、饱和度、整体亮度换成目标色 */
function shiftHSL(d,md,ch,hex,keepL){
  let sx=0,sy=0,ss=0,sl=0,n=0;
  for(let i=0;i<d.length;i+=4){ if(md[i+ch]<128||!d[i+3]) continue; const [h,s,l]=rgb2hsl(d[i],d[i+1],d[i+2]), a=h*Math.PI/180; sx+=Math.cos(a)*s; sy+=Math.sin(a)*s; ss+=s; sl+=l; n++; }
  if(!n) return;
  const sH=(Math.atan2(sy,sx)*180/Math.PI+360)%360, sS=ss/n, sL=sl/n, [tH,tS,tL]=rgb2hsl(...hex2(hex)), k=keepL?1:Math.log(Math.max(tL,1e-3))/Math.log(Math.max(sL,1e-3));
  for(let i=0;i<d.length;i+=4){ if(md[i+ch]<128||!d[i+3]) continue; const [h,s,l]=rgb2hsl(d[i],d[i+1],d[i+2]), dh=((h-sH+540)%360)-180;
    const c=hsl2rgb(tH+dh*0.25, Math.min(1,s*tS/Math.max(sS,1e-3)), Math.min(1,Math.pow(Math.max(l,1e-4),k))); d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; }
}

function simFocusDays(){
  const intern=S.studyMode==="intern"||S.lean==="intern";
  for(let d=S.day+1; d<=DAYS; d++){
    S.day=d; startDay(); S.phase="sim"; S.app="sim";
    S.residue*=0.7; S.eff=Math.max(0.2,1-0.8*S.residue); S.stress=Math.max(10,S.stress-2.5-rnd(0,1.5)); S.tired=false;
    const focus=245+ri(0,45), itMin=intern&&S.internState==="open"?120:0;
    for(let m=1;m<=MINUTES;m++){
      S.minute=m; S.stocks.forEach(s=>{ if(!s.delisted) s.price=s.path[m]; }); S.index.val=S.index.path[m];
      if(m<=focus){ S.studyMode=m<=itMin?"intern":"ky"; studyMinute(); }
    }
    if(intern&&S.internState==="open"){ addIntern(90*S.eff); syncPct(); }
    simClose(d);
  }
  S.phase="focus";
}
